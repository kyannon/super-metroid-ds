# Super Metroid DS settings. Lines are key = value; # starts a comment.
# Choices made in the settings menu are kept in states/prefs.cfg and win over these.

# The ROM: a .sfc / .smc of Super Metroid (Japan, USA). Empty: the first one
# found next to the program, in its roms/ folder, or in rom_dir.
rom =
rom_dir = /storage/roms/snes:/storage/roms/ports/super-metroid

# Screens: auto | span-h | span-v | dual | single
layout = auto
# 1: the HUD and map on the first (top) screen, the game on the second
swap = 0
# the screen with the touch panel: first | second
touch_screen = second
# integer (pixel perfect) | fit | zoom | stretch
scale = integer
map_scale = integer
# over both screens: off | grid (LCD pixel grid) | scanlines
shader = off
lcd_strength = 35
scanline_strength = 45

# Second screen: 0 plays on one screen with the game's own HUD area left empty
map = 1
# frames (60 a second) between map refreshes; it also refreshes on entering a room
map_interval = 90
map_animations = 1

# Buttons: SNES A is the right face button, B the bottom one; ab_swap = 1 flips them
ab_swap = 0
# the menu / hotkey button: guide (HOME) or back (SELECT)
hotkey = guide
# select+start: SELECT and START together also open the menu
menu_combo = none
# fast-forward (hold R2) speed
ff_speed = 3
# hold L2 to rewind (L3 swaps the screens); a state every rewind_step frames,
# kept in rewind_mb megabytes of memory
rewind = 1
rewind_step = 2
rewind_mb = 64

# Files: battery save (.srm) next to the ROM unless save_dir is set
save_dir =
# Take Screenshot: empty saves them in the screenshots folder next to the program
screenshot_dir =
auto_resume = 1

audio_latency = 64
show_fps = 0
frame_buffer = 0
match_display = 0
